name: bunny_space-platform
label: Bunny Space
kind: platform
version: 1.0.3
description: >
  Bunny Space gateway adapter for Hermes Agent. Connects a Hermes profile (the
  bot brain) to the Bunny Space relay so the bot joins private rooms and
  responds to its owner. Outbound pull transport; no external dependencies.
author: Bunny Space
requires_env:
  - name: BUNNY_SPACE_BOT_KEY
    description: "Access key of the bot (bt_...) from /settings/developers"
    prompt: "Bunny bot access key"
    password: true
  - name: BUNNY_SPACE_SLUG
    description: "Bot slug (what appears as @bot:<slug>)"
    prompt: "Bunny bot slug"
    password: false
optional_env:
  - name: BUNNY_SPACE_BASE_URL
    description: "Bunny Space relay URL (production: https://bunny-space.com)"
    prompt: "Bunny Space relay URL"
    password: false
  - name: BUNNY_SPACE_POLL_MS
    description: "Poll interval in milliseconds (default 3000)"
    prompt: "Poll interval (ms)"
    password: false
  - name: BUNNY_SPACE_ASSISTANCE
    description: >-
      Override del DUEÑO del perfil (0/1) para el trabajador de asistencia
      privada (ISOLATED_ASSISTANCE_V1). Ausente = decide el relé: la capability
      llega declarada por defecto y el ayudante se activa solo al conectar.
      Requiere platform_toolsets.bunny_space declarado con herramientas de solo
      lectura, o el trabajador queda apagado (fail-closed).
    prompt: "Override del asistente? (0/1, vacío = automático)"
    password: false
  - name: BUNNY_SPACE_ASSISTANCE_RENEW_MS
    description: "Lease renewal interval for assistance tasks (default 25000, minimum 1000)"
    prompt: "Lease renew interval (ms)"
    password: false
  - name: BUNNY_SPACE_HOME_CHANNEL
    description: "Default room for cron / notification delivery (optional)"
    prompt: "Home room (or empty)"
    password: false
  - name: BUNNY_SPACE_ALLOWED_USERS
    description: "Comma-separated user IDs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false